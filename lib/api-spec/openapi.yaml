    PlanTier:
      type: string
      enum: [starter, church, plus]
      description: The church's plan. Modules list the lowest plan that includes them.
    ModulePlan:
      type: string
      enum: [starter, church, plus, addon]
      description: Lowest plan that includes the module; "addon" is sold or granted separately.
    ModuleStatus:
      type: string
      enum: [available, beta, coming_soon, retired]
    ModuleBase:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ModuleStatus"
        plan:
          $ref: "#/components/schemas/ModulePlan"
        roles:
          type: array
          description: Roles that use the module once switched on.
          items:
            $ref: "#/components/schemas/MemberRole"
        priceNote:
          type: ["string", "null"]
        builtin:
          type: boolean
          description: Backed by product code; built-in modules can be retired but not deleted.
        sortOrder:
          type: integer
      required: [id, name, description, status, plan, roles, priceNote, builtin, sortOrder]
    ChurchModule:
      allOf:
        - $ref: "#/components/schemas/ModuleBase"
        - type: object
          properties:
            entitled:
              type: boolean
              description: The church's plan, a free grant or early access includes it.
            granted:
              type: boolean
            enabled:
              type: boolean
              description: The church has it switched on.
            active:
              type: boolean
              description: Available, entitled and switched on.
            interested:
              type: boolean
              description: This church said "We'd use this".
          required: [entitled, granted, enabled, active, interested]
    ChurchModules:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/PlanTier"
        earlyAccess:
          type: boolean
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ChurchModule"
      required: [plan, earlyAccess, modules]
    ChurchModuleUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        interested:
          type: boolean
    ModuleSuggestionInput:
      type: object
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 1000
      required: [text]
    PlatformModule:
      allOf:
        - $ref: "#/components/schemas/ModuleBase"
        - type: object
          properties:
            activeChurches:
              type: integer
            interestedChurches:
              type: integer
            grantedChurches:
              type: integer
          required: [activeChurches, interestedChurches, grantedChurches]
    ModuleSuggestion:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        churchName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, text, churchName, email, createdAt]
    PlatformModules:
      type: object
      properties:
        earlyAccess:
          type: boolean
        modules:
          type: array
          items:
            $ref: "#/components/schemas/PlatformModule"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ModuleSuggestion"
      required: [earlyAccess, modules, suggestions]
    ModuleInput:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,39}$"
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          minLength: 5
          maxLength: 500
        status:
          $ref: "#/components/schemas/ModuleStatus"
        plan:
          $ref: "#/components/schemas/ModulePlan"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MemberRole"
        priceNote:
          type: ["string", "null"]
          maxLength: 120
        sortOrder:
          type: integer
      required: [id, name, description, status, plan]
    ModuleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          minLength: 5
          maxLength: 500
        status:
          $ref: "#/components/schemas/ModuleStatus"
        plan:
          $ref: "#/components/schemas/ModulePlan"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MemberRole"
        priceNote:
          type: ["string", "null"]
          maxLength: 120
        sortOrder:
          type: integer
    PlatformSettings:
      type: object
      properties:
        earlyAccess:
          type: boolean
          description: While true, every church can use every available module without a plan.
      required: [earlyAccess]
    PlatformSettingsUpdate:
      type: object
      properties:
        earlyAccess:
          type: boolean
      required: [earlyAccess]
    WorkspaceAccessUpdate:
      type: object
      properties:
        plan:
          $ref: "#/components/schemas/PlanTier"
        grants:
          type: array
          items:
            type: string
    PlatformAuditEntry:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        actorEmail:
          type: string
        target:
          type: string
        details:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, action, actorEmail, target, details, createdAt]
    MemberRole:
      type: string
      enum: [pastor, staff, finance, admin, prayer_team]
      description: >-
        Church roles. A role is a starting point: it sets a person's default access,
        which a pastor can adjust (see Permission). Pastors always have full access,
        including counselling, private notes, Message Prep, the blog and approvals,
        which are never given to other roles.
    Permission:
      type: string
      enum: [enquiries, prayer, calendar, qr, reports, expenses, payments, team]
      description: >-
        One area a non-pastor can be given. enquiries = general enquiries in the care
        inbox; prayer = prayer requests the person agreed to share with the prayer team
        (never contact details); calendar = the pastor's appointments; qr = QR links;
        reports = submit department reports; expenses = submit expenses; payments =
        record payments on approved expenses; team = team, settings and modules.
        Only pastors can give enquiries, prayer or calendar.
    TeamMember:
      type: object
      properties:
        id:
          type: string
        uid:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        permissions:
          type: array
          description: What this person can see and do (pastors have everything).
          items:
            $ref: "#/components/schemas/Permission"
        customAccess:
          type: boolean
          description: True when a pastor has adjusted this person's access from the role's defaults.
        department:
          type: ["string", "null"]
        active:
          type: boolean
        isCurrentUser:
          type: boolean
      required: [id, uid, name, email, role, permissions, customAccess, department, active, isCurrentUser]
    TeamInvitation:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        department:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, permissions, department, createdAt]
    TeamOverview:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/TeamInvitation"
      required: [members, invitations]
    InvitationInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/MemberRole"
        permissions:
          type: array
          description: Leave out to use the role's defaults.
          items:
            $ref: "#/components/schemas/Permission"
        department:
          type: ["string", "null"]
          maxLength: 120
      required: [email, role]
    MemberUpdate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
        permissions:
          type: array
          description: >-
            New access. Changing the role without sending permissions resets access to
            the new role's defaults.
          items:
            $ref: "#/components/schemas/Permission"
        department:
          type: ["string", "null"]
          maxLength: 120
        active:
          type: boolean
    Palette:
      type: string
      enum: [warm-cream, modern-cool, sage, heritage-blue, forest-dark]
      description: Workspace colour palette. Warm Cream is the default.
    FontFamily:
      type: string
      enum: [inter, manrope, roboto, lora]
      description: Workspace interface font. Inter is the default.
    FontSize:
      type: string
      enum: [small, normal, large]
      description: Workspace text size. Normal is the default.

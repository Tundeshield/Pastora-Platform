openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pastora church workspaces, public pastoral care and administration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: setup
  - name: workspace
  - name: public-care
  - name: requests
  - name: appointments
  - name: tasks
  - name: qr-codes
  - name: reports
  - name: expenses
  - name: settings
  - name: notifications
  - name: platform
  - name: team
  - name: modules
  - name: messages
  - name: blog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Check whether the Firebase services are configured
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /session:
    get:
      operationId: getSession
      tags: [workspace]
      summary: Get the signed-in user's active church membership
      responses:
        "200":
          description: Session and membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /onboarding:
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create the signed-in pastor's church workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [workspace]
      summary: Get actionable counts and upcoming work for the active church
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /public/churches/{slug}:
    get:
      operationId: getPublicChurch
      tags: [public-care]
      summary: Get public pastoral-care page information
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Public church profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChurch"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/churches/{slug}/requests:
    post:
      operationId: submitPublicRequest
      tags: [public-care]
      summary: Submit a public prayer, counselling, appointment or general enquiry
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRequestInput"
      responses:
        "201":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List pastoral requests visible to the signed-in user's role
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [prayer, counselling, appointment, general]
        - name: status
          in: query
          schema:
            type: string
            enum: [new, acknowledged, scheduled, resolved, closed]
      responses:
        "200":
          description: Pastoral requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PastoralRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create an internal pastoral request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PastoralRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /requests/{requestId}:
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update request status, assignment or follow-up
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PastoralRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /requests/{requestId}/notes:
    post:
      operationId: addRequestNote
      tags: [requests]
      summary: Add a restricted internal note to a pastoral request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestNoteInput"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestNote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments for the active church
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create an appointment or appointment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: Time conflicts with a confirmed appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Confirm, decline or reschedule an appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Time conflicts with a confirmed appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for the active church
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task status or details
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /qr-codes:
    get:
      operationId: listQrCodes
      tags: [qr-codes]
      summary: List QR links for the active church
      responses:
        "200":
          description: QR links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QrCode"
    post:
      operationId: createQrCode
      tags: [qr-codes]
      summary: Create a QR link for a public Pastora page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCodeInput"
      responses:
        "201":
          description: QR link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCode"
  /qr-codes/{qrCodeId}:
    patch:
      operationId: updateQrCode
      tags: [qr-codes]
      summary: Update a QR link's name, destination or active state
      parameters:
        - $ref: "#/components/parameters/QrCodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCodeUpdate"
      responses:
        "200":
          description: Updated QR link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCode"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List department reports
      responses:
        "200":
          description: Department reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentReport"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a department report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentReport"
  /reports/{reportId}:
    patch:
      operationId: reviewReport
      tags: [reports]
      summary: Review or comment on a department report
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReview"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentReport"
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expense requests
      responses:
        "200":
          description: Expense requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseRequest"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Submit an expense request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRequest"
  /expenses/{expenseId}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Approve, reject or record payment for an expense
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get church workspace settings
      responses:
        "200":
          description: Church settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update church workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchSettings"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List in-app notifications for the signed-in user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notification marked read
  /plans:
    get:
      operationId: listPlans
      tags: [workspace]
      summary: List configurable plans and commercial terms
      responses:
        "200":
          description: Available plan configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /platform/workspaces:
    get:
      operationId: listPlatformWorkspaces
      tags: [platform]
      summary: List every church workspace (Pastora administrators only; no pastoral content)
      responses:
        "200":
          description: Workspace overview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformWorkspace"
        "403":
          $ref: "#/components/responses/Forbidden"
  /platform/workspaces/{churchId}:
    get:
      operationId: getPlatformWorkspace
      tags: [platform]
      summary: One workspace with its members (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/ChurchId"
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformWorkspaceDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePlatformWorkspace
      tags: [platform]
      summary: Suspend or reactivate a workspace (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/ChurchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformWorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformWorkspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/workspaces/{churchId}/members/{uid}:
    patch:
      operationId: updatePlatformMember
      tags: [platform]
      summary: Change a member's role to rescue a workspace (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/ChurchId"
        - $ref: "#/components/parameters/Uid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformMemberUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformWorkspaceDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/users:
    get:
      operationId: listPlatformUsers
      tags: [platform]
      summary: List every Pastora account (Pastora administrators only)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"
        "403":
          $ref: "#/components/responses/Forbidden"
  /platform/users/{uid}:
    patch:
      operationId: updatePlatformUser
      tags: [platform]
      summary: Disable or re-enable an account (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/Uid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/audit:
    get:
      operationId: listPlatformAudit
      tags: [platform]
      summary: Recent actions taken from the admin console (Pastora administrators only)
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAuditEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /modules:
    get:
      operationId: listChurchModules
      tags: [modules]
      summary: The module catalog with this church's access and switches (pastors and admins)
      responses:
        "200":
          description: Modules for this church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchModules"
        "403":
          $ref: "#/components/responses/Forbidden"
  /modules/suggestions:
    post:
      operationId: suggestModule
      tags: [modules]
      summary: Suggest a module Pastora should build (pastors and admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleSuggestionInput"
      responses:
        "204":
          description: Suggestion received
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /modules/{moduleId}:
    patch:
      operationId: updateChurchModule
      tags: [modules]
      summary: Switch a module on or off, or register interest in an upcoming one (pastors and admins)
      parameters:
        - $ref: "#/components/parameters/ModuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchModuleUpdate"
      responses:
        "200":
          description: The module for this church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchModule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/modules:
    get:
      operationId: listPlatformModules
      tags: [platform]
      summary: Module catalog with usage, demand and suggestions (Pastora administrators only)
      responses:
        "200":
          description: Catalog overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformModules"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPlatformModule
      tags: [platform]
      summary: Add a module to the catalog (Pastora administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "201":
          description: Created module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformModule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A module with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /platform/modules/{moduleId}:
    patch:
      operationId: updatePlatformModule
      tags: [platform]
      summary: Edit a module in the catalog (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/ModuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpdate"
      responses:
        "200":
          description: Updated module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformModule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlatformModule
      tags: [platform]
      summary: Delete a module from the catalog; built-in modules can only be retired (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/ModuleId"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /platform/settings:
    patch:
      operationId: updatePlatformSettings
      tags: [platform]
      summary: Platform-wide switches such as early access (Pastora administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
  /platform/workspaces/{churchId}/access:
    patch:
      operationId: updatePlatformWorkspaceAccess
      tags: [platform]
      summary: Set a church's plan and free module grants (Pastora administrators only)
      parameters:
        - $ref: "#/components/parameters/ChurchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAccessUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformWorkspaceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Your messages and study notes (Message Prep module; private to you)
      responses:
        "200":
          description: Your messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Start a message or capture an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /messages/{messageId}:
    get:
      operationId: getMessage
      tags: [messages]
      summary: One of your messages
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMessage
      tags: [messages]
      summary: Save changes to one of your messages
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: The saved message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete one of your messages
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts:
    get:
      operationId: listPosts
      tags: [blog]
      summary: The church's blog posts for pastors (published posts, plus your own drafts)
      responses:
        "200":
          description: Posts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPost
      tags: [blog]
      summary: Start a blog post (as a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /posts/{postId}:
    get:
      operationId: getPost
      tags: [blog]
      summary: One post (your own, or a published one)
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      tags: [blog]
      summary: Save, publish or unpublish your own post
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdate"
      responses:
        "200":
          description: The saved post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePost
      tags: [blog]
      summary: Delete your own post
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/churches/{slug}/posts:
    get:
      operationId: getPublicBlog
      tags: [public-care]
      summary: A church's published blog posts (no sign-in needed)
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The church's blog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBlog"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/churches/{slug}/posts/{postId}:
    get:
      operationId: getPublicPost
      tags: [public-care]
      summary: One published blog post (no sign-in needed)
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPostPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/qr-codes/{qrCodeId}/visit:
    post:
      operationId: recordQrVisit
      tags: [public-care]
      summary: Count a visit from a scanned QR link (no personal data is stored)
      parameters:
        - $ref: "#/components/parameters/QrCodeId"
      responses:
        "204":
          description: Visit counted (or silently ignored for unknown or paused links)
  /team:
    get:
      operationId: getTeam
      tags: [team]
      summary: List church members and pending invitations (pastors and admins)
      responses:
        "200":
          description: Team overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamOverview"
        "403":
          $ref: "#/components/responses/Forbidden"
  /team/invitations:
    post:
      operationId: createInvitation
      tags: [team]
      summary: Invite a person by email to join the church with a role (pastors and admins; only pastors can add pastors once one exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The person already belongs to a workspace or is already invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /team/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [team]
      summary: Revoke a pending invitation (pastors and admins)
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Invitation revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /team/members/{membershipId}:
    patch:
      operationId: updateMember
      tags: [team]
      summary: Change a member's role, department or access (pastors and admins; never your own; only pastors can change a pastor)
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{1,39}$"
    ChurchId:
      name: churchId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    Uid:
      name: uid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 2
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    QrCodeId:
      name: qrCodeId
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The user's role does not permit this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: Firebase configuration is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SetupStatus:
      type: object
      properties:
        firebaseConfigured:
          type: boolean
        publicPortalEnabled:
          type: boolean
        billingProviderConfigured:
          type: boolean
      required: [firebaseConfigured, publicPortalEnabled, billingProviderConfigured]
    UserSummary:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        permissions:
          type: array
          description: What this person can see and do (pastors have everything).
          items:
            $ref: "#/components/schemas/Permission"
      required: [uid, name, email, role, permissions]
    Church:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        country:
          type: string
        timeZone:
          type: string
        logoUrl:
          type: ["string", "null"]
      required: [id, name, slug, country, timeZone, logoUrl]
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        church:
          anyOf:
            - $ref: "#/components/schemas/Church"
            - type: "null"
        subscriptionStatus:
          type: string
          enum: [setup_required, active, trialing, grace_period, read_only, cancelled]
        theme:
          $ref: "#/components/schemas/Palette"
        fontFamily:
          $ref: "#/components/schemas/FontFamily"
        fontSize:
          $ref: "#/components/schemas/FontSize"
        emailVerified:
          type: boolean
        invitationPending:
          type: boolean
          description: True when an invitation is waiting for this email but the email is not yet verified.
        churchSuspended:
          type: boolean
          description: True when Pastora has paused this church's workspace.
        platformAdmin:
          type: boolean
          description: True for Pastora's own administrators (server-side allow list).
        modules:
          type: array
          description: Ids of modules switched on and available to this church.
          items:
            type: string
      required: [user, church, subscriptionStatus, theme, fontFamily, fontSize, emailVerified, invitationPending, churchSuspended, platformAdmin, modules]
    WorkspaceInput:
      type: object
      properties:
        pastorName:
          type: string
          minLength: 1
          maxLength: 120
        churchName:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: ["string", "null"]
        country:
          type: string
          minLength: 2
          maxLength: 80
        timeZone:
          type: string
        theme:
          type: string
          enum: [warm-cream, modern-cool, sage, heritage-blue, forest-dark, system]
        creatorRole:
          type: string
          enum: [pastor, admin]
          description: Whether the person creating the workspace is the pastor or sets it up on the pastor's behalf.
      required: [pastorName, churchName, country, timeZone, theme]
    DashboardSummary:
      type: object
      properties:
        newPrayerRequests:
          type: integer
        counsellingAwaitingReview:
          type: integer
        upcomingAppointments:
          type: integer
        followUpsDue:
          type: integer
        overdueTasks:
          type: integer
        reportsAwaitingReview:
          type: integer
        expensesAwaitingApproval:
          type: integer
        nextAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        urgentFollowUps:
          type: array
          items:
            $ref: "#/components/schemas/PastoralRequest"
      required:
        - newPrayerRequests
        - counsellingAwaitingReview
        - upcomingAppointments
        - followUpsDue
        - overdueTasks
        - reportsAwaitingReview
        - expensesAwaitingApproval
        - nextAppointments
        - urgentFollowUps
    PublicChurch:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        welcomeMessage:
          type: string
        categories:
          type: array
          items:
            type: string
        appointmentEnabled:
          type: boolean
        emergencyNotice:
          type: string
        blogEnabled:
          type: boolean
          description: The church has the Pastor's blog module switched on.
      required: [name, slug, logoUrl, welcomeMessage, categories, appointmentEnabled, emergencyNotice, blogEnabled]
    PublicRequestInput:
      type: object
      properties:
        type:
          type: string
          enum: [prayer, counselling, appointment, general]
        name:
          type: ["string", "null"]
          maxLength: 120
        anonymous:
          type: boolean
        contact:
          type: ["string", "null"]
          maxLength: 200
        category:
          type: ["string", "null"]
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 5000
        preferredFormat:
          type: ["string", "null"]
          enum: [in-person, phone, video, null]
        preferredAvailability:
          type: ["string", "null"]
          maxLength: 500
        permissionToContact:
          type: boolean
        shareWithPrayerTeam:
          type: boolean
        preferredDate:
          type: ["string", "null"]
          format: date-time
        campaign:
          type: ["string", "null"]
          maxLength: 120
        qrCodeId:
          type: ["string", "null"]
          maxLength: 64
      required: [type, anonymous, message, permissionToContact, shareWithPrayerTeam]
    PublicRequestReceipt:
      type: object
      properties:
        reference:
          type: string
        received:
          type: boolean
      required: [reference, received]
    PastoralRequest:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [prayer, counselling, appointment, general]
        name:
          type: ["string", "null"]
        contact:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        message:
          type: string
        status:
          type: string
          enum: [new, acknowledged, scheduled, resolved, closed]
        assignedTo:
          type: ["string", "null"]
        nextAction:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        anonymous:
          type: boolean
        permissionToContact:
          type: boolean
        shareWithPrayerTeam:
          type: boolean
      required:
        - id
        - type
        - name
        - contact
        - category
        - message
        - status
        - assignedTo
        - nextAction
        - dueAt
        - createdAt
        - anonymous
        - permissionToContact
        - shareWithPrayerTeam
    InternalRequestInput:
      type: object
      properties:
        type:
          type: string
          enum: [prayer, counselling, appointment, general]
        name:
          type: ["string", "null"]
        contact:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        message:
          type: string
          minLength: 1
          maxLength: 5000
      required: [type, message]
    RequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [new, acknowledged, scheduled, resolved, closed]
        assignedTo:
          type: ["string", "null"]
        nextAction:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
    RequestNoteInput:
      type: object
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 5000
      required: [note]
    RequestNote:
      type: object
      properties:
        id:
          type: string
        requestId:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, requestId, note, createdAt]
    Appointment:
      type: object
      properties:
        id:
          type: string
        requesterName:
          type: string
        startAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        format:
          type: string
          enum: [in-person, phone, video]
        status:
          type: string
          enum: [requested, confirmed, declined, completed, cancelled]
        createdAt:
          type: string
          format: date-time
      required: [id, requesterName, startAt, durationMinutes, format, status, createdAt]
    AppointmentInput:
      type: object
      properties:
        requesterName:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: ["string", "null"]
          maxLength: 200
        startAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 240
        format:
          type: string
          enum: [in-person, phone, video]
        status:
          type: string
          enum: [requested, confirmed]
      required: [requesterName, startAt, durationMinutes, format, status]
    AppointmentUpdate:
      type: object
      properties:
        startAt:
          type: ["string", "null"]
          format: date-time
        durationMinutes:
          type: ["integer", "null"]
          minimum: 15
          maximum: 240
        status:
          type: string
          enum: [requested, confirmed, declined, completed, cancelled]
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, normal, high]
        status:
          type: string
          enum: [todo, in_progress, blocked, completed]
        assignedTo:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, title, description, priority, status, assignedTo, dueAt, createdAt]
    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
          maxLength: 2000
        priority:
          type: string
          enum: [low, normal, high]
        assignedTo:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
      required: [title, priority]
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
          maxLength: 2000
        priority:
          type: string
          enum: [low, normal, high]
        status:
          type: string
          enum: [todo, in_progress, blocked, completed]
        assignedTo:
          type: ["string", "null"]
        dueAt:
          type: ["string", "null"]
          format: date-time
    QrCode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        destination:
          type: string
          enum: [care, prayer, counselling, appointments, general]
        campaign:
          type: ["string", "null"]
        active:
          type: boolean
        visits:
          type: integer
        submissions:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, destination, campaign, active, visits, submissions, createdAt]
    QrCodeInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        destination:
          type: string
          enum: [care, prayer, counselling, appointments, general]
        campaign:
          type: ["string", "null"]
          maxLength: 120
      required: [name, destination]
    QrCodeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        destination:
          type: string
          enum: [care, prayer, counselling, appointments, general]
        campaign:
          type: ["string", "null"]
          maxLength: 120
        active:
          type: boolean
    DepartmentReport:
      type: object
      properties:
        id:
          type: string
        department:
          type: string
        period:
          type: string
        activities:
          type: string
        challenges:
          type: ["string", "null"]
        supportNeeded:
          type: ["string", "null"]
        nextPlans:
          type: string
        status:
          type: string
          enum: [submitted, reviewed, needs_follow_up]
        reviewComment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, department, period, activities, challenges, supportNeeded, nextPlans, status, reviewComment, createdAt]
    ReportInput:
      type: object
      properties:
        department:
          type: string
          minLength: 1
          maxLength: 120
        period:
          type: string
          minLength: 1
          maxLength: 80
        activities:
          type: string
          minLength: 1
          maxLength: 5000
        challenges:
          type: ["string", "null"]
          maxLength: 3000
        supportNeeded:
          type: ["string", "null"]
          maxLength: 3000
        nextPlans:
          type: string
          minLength: 1
          maxLength: 3000
      required: [department, period, activities, nextPlans]
    ReportReview:
      type: object
      properties:
        status:
          type: string
          enum: [reviewed, needs_follow_up]
        reviewComment:
          type: ["string", "null"]
          maxLength: 3000
      required: [status]
    ExpenseRequest:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        purpose:
          type: string
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          enum: [NGN]
        department:
          type: ["string", "null"]
        status:
          type: string
          enum: [submitted, approved, rejected, clarification, paid]
        requesterId:
          type: string
        receiptPath:
          type: ["string", "null"]
        paymentReference:
          type: ["string", "null"]
        approvedBy:
          type: ["string", "null"]
        clarification:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, description, purpose, amount, currency, department, status, requesterId, receiptPath, paymentReference, createdAt]
    ExpenseInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        purpose:
          type: string
          minLength: 1
          maxLength: 2000
        amount:
          type: number
          exclusiveMinimum: 0
        department:
          type: ["string", "null"]
          maxLength: 120
        receiptPath:
          type: ["string", "null"]
      required: [description, purpose, amount]
    ExpenseUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected, clarification, paid]
        paymentReference:
          type: ["string", "null"]
          maxLength: 200
        clarification:
          type: ["string", "null"]
          maxLength: 2000
    ChurchSettings:
      type: object
      properties:
        church:
          $ref: "#/components/schemas/Church"
        theme:
          type: string
          enum: [warm-cream, modern-cool, sage, heritage-blue, forest-dark, system]
        welcomeMessage:
          type: string
        emergencyNotice:
          type: string
        appointmentDurationMinutes:
          type: integer
        appointmentEnabled:
          type: boolean
        publicPortalEnabled:
          type: boolean
        categories:
          type: array
          items:
            type: string

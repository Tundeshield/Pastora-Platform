name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: API tests (in-memory Firestore)
        run: pnpm --filter @workspace/api-server test
      - name: Security Rules + API tests (Firebase Emulator Suite)
        run: pnpm test:emulator
      - name: Build web app and Netlify function
        run: pnpm --filter @workspace/api-server build && pnpm --filter @workspace/pastora build

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastora</title>
    <meta name="description" content="Pastora gives pastors a calm, private workspace for prayer and counselling requests, appointments, follow-ups and church operations, with a public care portal reachable by QR code." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Pastora" />
    <meta property="og:description" content="Pastora gives pastors a calm, private workspace for prayer and counselling requests, appointments, follow-ups and church operations, with a public care portal reachable by QR code." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pastora" />
    <meta name="twitter:description" content="Pastora gives pastors a calm, private workspace for prayer and counselling requests, appointments, follow-ups and church operations, with a public care portal reachable by QR code." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f6ef" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Lets Netlify Forms detect the Support form at build time; the app posts to it. -->
    <form name="support" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="church" />
      <input name="topic" /><textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
